# Octomind user-tap scaffold contract.
# This file is consumed by `octomind tap init`; it is not copied into the
# generated tap. Everything below `root/` is copied after token rendering.

schema = 1
root = "root"

required_tokens = [
  "__TAP_ID__",
  "__TAP_OWNER__",
  "__TAP_NAME__",
  "__TAP_REPOSITORY__",
  "__AGENT_DOMAIN__",
  "__AGENT_SPEC__",
  "__YEAR__",
]

# Octomind releases that let `--agent` choose the starter's spec read this default.
# Current releases always name the starter `chief` and ignore it.
[defaults]
agent_spec = "chief"

[post_create]
executable = [
  "deps/lib/platform.sh",
  "scripts/check.sh",
  "templates/dep.sh",
]
validate = "bash scripts/check.sh"
