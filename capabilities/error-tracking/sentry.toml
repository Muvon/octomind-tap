# capabilities/error-tracking/sentry.toml
# Capability: error-tracking
# Provider: Sentry — official error tracking MCP server
# Title: Error Tracking (Sentry)
# Description: Look up Sentry issues, error events, and releases to triage production errors via the Sentry MCP server. Needs SENTRY_ACCESS_TOKEN.

[deps]
require = ["sentry/sentry"]

[roles.mcp]
server_refs = ["sentry"]
allowed_tools = ["sentry:*"]

[[mcp.servers]]
name = "sentry"
type = "stdio"
command = "npx"
args = ["-y", "@sentry/mcp-server@0.42.0"]
timeout_seconds = 60
env = { SENTRY_ACCESS_TOKEN = "{{ENV:SENTRY_ACCESS_TOKEN}}" }
tools = []
