# capabilities/scraping/firecrawl.toml
# Capability: scraping
# Provider: Firecrawl — web scraping, crawling, and site mapping
# Title: Web Scraping
# Description: Scrape single pages, crawl whole sites, and map a site's URLs into clean content with Firecrawl. Needs FIRECRAWL_API_KEY.

[deps]
require = ["firecrawl/firecrawl"]

[roles.mcp]
server_refs = ["firecrawl"]
allowed_tools = ["firecrawl:*"]

[[mcp.servers]]
name = "firecrawl"
type = "stdio"
command = "npx"
args = ["-y", "firecrawl-mcp@3.34.1"]
timeout_seconds = 120
env = { FIRECRAWL_API_KEY = "{{ENV:FIRECRAWL_API_KEY}}" }
tools = []
