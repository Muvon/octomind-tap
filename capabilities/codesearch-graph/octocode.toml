# capabilities/codesearch-graph/octocode.toml
# Capability: codesearch-graph
# Provider: octocode — code dependency graph search
# Title: Code Search (Graph)
# Description: Trace callers, imports, inheritance, and dependency paths between symbols and files with octocode's graphrag code-graph tool.
#
# Always available: graphrag answers from a live Tree-sitter symbol graph built
# directly from source — no index and no graphrag.enabled required. When the
# persisted GraphRAG index exists, its enrichment is overlaid automatically.

[deps]
require = ["muvon/octocode"]

[roles.mcp]
server_refs = ["octocode"]
allowed_tools = ["octocode:graphrag"]

[[mcp.servers]]
name = "octocode"
type = "stdio"
command = "octocode"
args = ["mcp", "--path=."]
timeout_seconds = 300
tools = []
