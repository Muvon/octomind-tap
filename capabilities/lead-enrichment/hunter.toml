# capabilities/lead-enrichment/hunter.toml
# Capability: lead-enrichment
# Provider: Hunter official remote MCP — domain search, email finder, email verifier
# Title: Hunter MCP – Email Finder and Verifier
# Description: Hunter email finder and email verifier via the official MCP server: domain search, find addresses by name, check deliverability. Requires HUNTER_API_KEY.
# https://hunter.io/api-documentation#mcp
# Env: HUNTER_API_KEY — Hunter.io API key (app.hunter.io → Settings → API Keys);
# sent as the X-API-KEY header the hosted Streamable HTTP endpoint documents.
# Alternative to Apollo — swap with: ln -sf hunter.toml capabilities/lead-enrichment/default.toml

[roles.mcp]
server_refs = ["hunter"]
allowed_tools = ["hunter:*"]

[[mcp.servers]]
name = "hunter"
type = "http"
url = "https://mcp.hunter.io/mcp"
headers = { X-API-KEY = "{{ENV:HUNTER_API_KEY}}" }
timeout_seconds = 300
tools = []
