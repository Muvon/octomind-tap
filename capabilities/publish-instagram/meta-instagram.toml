# capabilities/publish-instagram/meta-instagram.toml
# Capability: publish-instagram
# Provider: Meta Instagram Graph API — Reels and feed video publishing
# Title: Instagram Publishing
# Description: Publish Reels, feed video, Stories and carousels via the Meta Instagram Graph API.
# Provides tools: publish_media, publish_carousel, publish_reel, get_content_publishing_limit, get_media_posts, get_media_insights, validate_access_token

[deps]
require = ["meta-instagram/meta-instagram"]

[roles.mcp]
server_refs = ["instagram"]
allowed_tools = ["publish_media", "publish_carousel", "publish_reel", "get_content_publishing_limit", "get_media_posts", "get_media_insights", "validate_access_token"]

[[mcp.servers]]
name = "instagram"
type = "stdio"
command = "npx"
args = ["-y", "@mcpware/instagram-mcp@1.0.4"]
timeout_seconds = 240
env = { INSTAGRAM_ACCESS_TOKEN = "{{INPUT:META_ACCESS_TOKEN}}", INSTAGRAM_ACCOUNT_ID = "{{INPUT:IG_USER_ID}}" }
tools = []
