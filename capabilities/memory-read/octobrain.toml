# capabilities/memory-read/octobrain.toml
# Capability: memory-read
# Provider: octobrain — read-only memory subset
# Title: Memory (Read)
# Description: Semantic memory recall via the octobrain MCP server (remember tool, with 1-hop graph neighbors).

[deps]
require = ["muvon/octobrain"]

[roles.mcp]
server_refs = ["octobrain"]
allowed_tools = ["octobrain:remember"]

[[mcp.servers]]
name = "octobrain"
type = "stdio"
command = "octobrain"
args = ["mcp"]
timeout_seconds = 300
tools = []
