# capabilities/memory-read/octobrain.toml
# Capability: memory-read
# Provider: octobrain — read-only memory subset
# Title: Memory (Read)
# Description: Recall stored memories by meaning with octobrain's remember tool, which also returns related memories one hop away in the memory graph.

[deps]
require = ["muvon/octobrain"]

[roles.mcp]
server_refs = ["octobrain"]
allowed_tools = ["octobrain:remember"]

[[mcp.servers]]
name = "octobrain"
type = "stdio"
command = "octobrain"
args = ["mcp"]
timeout_seconds = 300
tools = []
