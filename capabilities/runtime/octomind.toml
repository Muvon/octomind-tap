# capabilities/runtime/octomind.toml
# Capability: runtime
# Provider: octomind
# Title: Octomind Runtime Control
# Description: Add and remove MCP servers, spawn dynamic agents, and activate skills and capabilities mid-session through Octomind's built-in runtime server.

[roles.mcp]
server_refs = ["runtime"]
allowed_tools = ["runtime:*"]

[[mcp.servers]]
name = "runtime"
type = "builtin"
timeout_seconds = 30
tools = []
