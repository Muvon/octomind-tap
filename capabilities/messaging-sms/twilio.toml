# capabilities/messaging-sms/twilio.toml
# Capability: messaging-sms
# Provider: Twilio — SMS and voice messaging
# Title: SMS Messaging (Twilio)
# Description: Send SMS and place voice calls via the Twilio MCP server (twilio_api_v2010). Needs TWILIO_ACCOUNT_SID, TWILIO_API_KEY, TWILIO_API_SECRET.

[deps]
require = ["twilio/twilio"]

[roles.mcp]
server_refs = ["twilio"]
allowed_tools = []

[[mcp.servers]]
name = "twilio"
type = "stdio"
command = "npx"
# Credentials are positional (SID/KEY:SECRET) — the server ignores env vars.
args = ["-y", "@twilio-alpha/mcp@0.7.0", "{{ENV:TWILIO_ACCOUNT_SID}}/{{ENV:TWILIO_API_KEY}}:{{ENV:TWILIO_API_SECRET}}", "--services", "twilio_api_v2010"]
timeout_seconds = 60
tools = []
