# capabilities/devdocs/context7.toml
# Capability: devdocs
# Provider: Context7 — library and framework documentation lookup
# Title: Developer Docs
# Description: Pull current, version-specific documentation and code examples for libraries and frameworks into the prompt via the Context7 MCP server.

[deps]
require = ["upstash/context7"]

[roles.mcp]
server_refs = ["context7"]
allowed_tools = ["context7:*"]

[[mcp.servers]]
name = "context7"
type = "stdio"
command = "npx"
args = ["-y", "@upstash/context7-mcp@4.4.4"]
timeout_seconds = 60
tools = []
