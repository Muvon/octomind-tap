	"write ten posts for the same account without repeating myself",
	"check whether this post is too similar to my recent ones",
	"keep a weekly newsletter from sounding repetitive",
	"give each blog post in the series a different structure",
	"write several ad angles that don't repeat each other",
	"vary the hooks across my video scripts",
