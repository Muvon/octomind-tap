# capabilities/orchestration/default.toml
# Capability: orchestration
# Provider: Octomind built-in orchestration server
# Title: Orchestration
# Description: Agent delegation (tap: run copies of the agent or hand a task to the agent that fits) and session-flow control (schedule) via the built-in server.
# Provides tools: tap — run copies of the agent or hand a task to another agent; schedule — defer/recur session messages

[roles.mcp]
server_refs = ["orchestration"]
allowed_tools = ["orchestration:*"]

[[mcp.servers]]
name = "orchestration"
type = "builtin"
timeout_seconds = 30
tools = []
