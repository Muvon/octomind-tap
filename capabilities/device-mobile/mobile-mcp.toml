# capabilities/device-mobile/mobile-mcp.toml
# Capability: device-mobile
# Provider: Mobile MCP — iOS & Android device automation (real + simulator)
# Title: Mobile Device Automation
# Description: Tap, swipe, type, and take screenshots on iOS and Android devices and simulators through the Mobile MCP server (@mobilenext/mobile-mcp).
# https://github.com/mobile-next/mobile-mcp

[deps]
require = ["mobile-next/mobile-mcp"]

[roles.mcp]
server_refs = ["mobile-mcp"]
allowed_tools = ["mobile-mcp:*"]

[[mcp.servers]]
name = "mobile-mcp"
type = "stdio"
command = "sh"
# sh wrapper: octomind drops the env table at parse time, so constants and
# derived paths must be exported by the launch command itself.
args = ["-c", "MOBILEMCP_DISABLE_TELEMETRY=1 exec npx -y @mobilenext/mobile-mcp@1.0.12"]
timeout_seconds = 120
tools = []
