# capabilities/messaging-whatsapp/iflow-mcp.toml
# Capability: messaging-whatsapp
# Provider: @iflow-mcp/mcp-whatsapp-web — WhatsApp Web messaging
# Title: WhatsApp Web Messaging
# Description: Send and read WhatsApp messages through WhatsApp Web, look up contacts, and share media via the @iflow-mcp/mcp-whatsapp-web server.
# Auth: QR code scan via get_qr_code tool on first run; session persists locally.

[deps]
require = ["iflow-mcp/whatsapp"]

[roles.mcp]
server_refs = ["whatsapp"]
allowed_tools = []

[[mcp.servers]]
name = "whatsapp"
type = "stdio"
command = "npx"
args = ["-y", "@iflow-mcp/mcp-whatsapp-web@1.0.1"]
timeout_seconds = 60
tools = []
