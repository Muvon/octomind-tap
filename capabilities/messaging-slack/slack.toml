# capabilities/messaging-slack/slack.toml
# Capability: messaging-slack
# Provider: Slack — official MCP Slack server
# Title: Slack Messaging MCP Server
# Description: Read and post Slack channel messages and threads and look up users via the official Slack MCP server. Needs SLACK_BOT_TOKEN, SLACK_TEAM_ID.

[deps]
require = ["modelcontextprotocol/slack"]

[roles.mcp]
server_refs = ["slack"]
allowed_tools = []

[[mcp.servers]]
name = "slack"
type = "stdio"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-slack@2025.4.25"]
timeout_seconds = 60
env = { SLACK_BOT_TOKEN = "{{ENV:SLACK_BOT_TOKEN}}", SLACK_TEAM_ID = "{{ENV:SLACK_TEAM_ID}}" }
tools = []
