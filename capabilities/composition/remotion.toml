# capabilities/composition/remotion.toml
# Capability: composition
# Provider: Remotion — code-driven (React) video composition + Lambda render
# Title: Video Composition
# Description: Programmatic React-based video composition for templated ad variants and explainer videos.
# Provides tools: init_remotion_project, create_composition_scaffold, add_component, update_composition, get_composition_code, list_compositions, list_project_files, render_video, render_still, render_gif, get_render_status, query_remotion_docs

[deps]
require = ["remotion/remotion", "ffmpeg/ffmpeg"]

[roles.mcp]
server_refs = ["remotion"]
allowed_tools = ["init_remotion_project", "create_composition_scaffold", "add_component", "update_composition", "get_composition_code", "list_compositions", "list_project_files", "render_video", "render_still", "render_gif", "get_render_status", "query_remotion_docs"]

[[mcp.servers]]
name = "remotion"
type = "stdio"
command = "npx"
args = ["-y", "remotion-mcp@1.0.5"]
timeout_seconds = 600
env = { REMOTION_LICENSE_KEY = "{{ENV:REMOTION_LICENSE_KEY}}" }
tools = []
