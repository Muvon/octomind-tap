# capabilities/highlights/readwise.toml
# Capability: highlights
# Provider: Readwise — reading highlights and annotations via MCP
# Title: Highlights (Readwise)
# Description: Reading highlights, book annotations, and saved articles via the Readwise MCP server.

[deps]
require = ["readwise/readwise"]

[roles.mcp]
server_refs = ["readwise"]
allowed_tools = ["readwise_*"]

[[mcp.servers]]
name = "readwise"
type = "stdio"
command = "npx"
args = ["-y", "readwise-mcp-enhanced@1.0.1"]
timeout_seconds = 60
env = { READWISE_TOKEN = "{{ENV:READWISE_TOKEN}}" }
tools = []
