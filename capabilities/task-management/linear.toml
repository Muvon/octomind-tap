# capabilities/task-management/linear.toml
# Capability: task-management
# Provider: Linear — issue tracking and project management via MCP
# Title: Task Management (Linear)
# Description: Create, search, and update Linear issues, projects, and teams via the @tacticlaunch/mcp-linear server. Needs LINEAR_API_KEY.

[deps]
require = ["linear-app/linear"]

[roles.mcp]
server_refs = ["linear"]
allowed_tools = ["linear:*"]

[[mcp.servers]]
name = "linear"
type = "stdio"
command = "npx"
args = ["-y", "@tacticlaunch/mcp-linear@1.4.5"]
timeout_seconds = 60
env = { LINEAR_API_KEY = "{{ENV:LINEAR_API_KEY}}" }
tools = []
