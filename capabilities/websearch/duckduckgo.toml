# capabilities/websearch/duckduckgo.toml
# Capability: websearch
# Provider: Open-WebSearch — keyless multi-engine web search, DuckDuckGo default
# Title: Web Search (DuckDuckGo)
# Description: Free keyless web search via DuckDuckGo with Bing/Startpage/Brave fallback (Open-WebSearch MCP).
# Provides tools: search
# https://github.com/Aas-ee/open-webSearch

[deps]
require = ["aas-ee/open-websearch"]

[roles.mcp]
server_refs = ["open-websearch"]
allowed_tools = ["search"]

[[mcp.servers]]
name = "open-websearch"
type = "stdio"
command = "sh"
# sh wrapper: octomind drops the env table at parse time, so constants and
# derived paths must be exported by the launch command itself.
args = ["-c", "MODE=stdio DEFAULT_SEARCH_ENGINE=duckduckgo ALLOWED_SEARCH_ENGINES=duckduckgo,bing,startpage,brave exec npx -y open-websearch@2.1.11"]
timeout_seconds = 60
tools = []
