# capabilities/voice/whisper.toml
# Capability: voice
# Provider: OpenAI Whisper — TTS via OpenAI tts-1, plus transcription
# Title: Voice Synthesis
# Description: OpenAI TTS and transcription via the Whisper MCP server.
# Provides tools: create_audio, transcribe_audio, convert_audio, compress_audio, list_audio_files, chat_with_audio

[deps]
require = ["whisper/whisper"]

[roles.mcp]
server_refs = ["whisper"]
allowed_tools = ["create_audio", "transcribe_audio", "convert_audio", "compress_audio", "list_audio_files", "chat_with_audio"]

[[mcp.servers]]
name = "whisper"
type = "stdio"
command = "sh"
# --with mcp<2: server imports mcp.server.fastmcp, removed in the mcp 2.x SDK.
# sh wrapper: octomind drops the env table at parse time, so constants and
# derived paths must be exported by the launch command itself.
args = ["-c", "mkdir -p \"$PWD/video-out\"; AUDIO_FILES_PATH=\"$PWD/video-out\" exec uvx --with 'mcp<2' mcp-server-whisper==1.1.0"]
timeout_seconds = 120
env = { OPENAI_API_KEY = "{{ENV:OPENAI_API_KEY}}" }
tools = []
