# capabilities/filesystem-write/octofs.toml
# Capability: filesystem-write
# Provider: octofs — Octomind's native filesystem MCP server (write subset)
# Title: Filesystem (Write)
# Description: Create, edit and delete files, apply several changes to one file in a single call, copy line ranges between files, and undo the last edit.

[deps]
require = ["muvon/octofs"]

[roles.mcp]
server_refs = ["octofs"]
allowed_tools = ["octofs:text_editor", "octofs:batch_edit"]

[[mcp.servers]]
name = "octofs"
type = "stdio"
command = "octofs"
args = ["mcp"]
timeout_seconds = 300
tools = []
