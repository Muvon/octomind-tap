# capabilities/lipsync/sync.toml
# Capability: lipsync
# Provider: Sync.so — official MCP server (@sync.so/mcp-server)
# Title: Lipsync
# Description: Generate lip-synced video from a clip plus audio or text-to-speech with Sync.so sync-1.9 and sync-2, and manage assets. Needs SYNC_API_KEY.
# Provides tools: generate_create-generation, generate_get-generation, generations_*, assets_*, tts_create, voices_* (33 tools)

[deps]
require = ["sync/sync"]

[roles.mcp]
server_refs = ["sync"]
allowed_tools = ["sync:*"]

[[mcp.servers]]
name = "sync"
type = "stdio"
command = "npx"
args = ["-y", "@sync.so/mcp-server@0.1.4"]
timeout_seconds = 180
env = { SYNC_API_KEY = "{{ENV:SYNC_API_KEY}}" }
tools = []
