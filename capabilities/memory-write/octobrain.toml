# capabilities/memory-write/octobrain.toml
# Capability: memory-write
# Provider: octobrain — write subset (mutations)
# Title: Memory (Write)
# Description: Save facts, decisions, and lessons to persistent memory with octobrain memorize, and delete outdated entries with forget.

[deps]
require = ["muvon/octobrain"]

[roles.mcp]
server_refs = ["octobrain"]
allowed_tools = ["octobrain:memorize", "octobrain:forget"]

[[mcp.servers]]
name = "octobrain"
type = "stdio"
command = "octobrain"
args = ["mcp"]
timeout_seconds = 300
tools = []
