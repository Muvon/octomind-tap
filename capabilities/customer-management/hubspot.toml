# capabilities/customer-management/hubspot.toml
# Capability: customer-management
# Provider: HubSpot — official MCP server
# Title: HubSpot CRM Customer Management
# Description: Look up and update HubSpot CRM contacts, deals, and marketing campaigns via the official HubSpot MCP server. Needs PRIVATE_APP_ACCESS_TOKEN.

[deps]
require = ["hubspot/hubspot"]

[roles.mcp]
server_refs = ["hubspot"]
allowed_tools = ["hubspot:*"]

[[mcp.servers]]
name = "hubspot"
type = "stdio"
command = "npx"
args = ["-y", "@hubspot/mcp-server@0.4.0"]
timeout_seconds = 60
env = { PRIVATE_APP_ACCESS_TOKEN = "{{ENV:PRIVATE_APP_ACCESS_TOKEN}}" }
tools = []
