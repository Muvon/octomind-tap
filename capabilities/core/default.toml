# capabilities/core/default.toml
# Capability: core
# Provider: Octomind built-in core server
# Title: Core Built-ins
# Description: Octomind built-in core server: recall of folded context blocks. Planning is supervisor-owned, not a tool.
# Provides tools: recall — only when [compression.attention] or its governance is enabled

[roles.mcp]
server_refs = ["core"]
allowed_tools = ["core:*"]

[[mcp.servers]]
name = "core"
type = "builtin"
timeout_seconds = 30
tools = []
