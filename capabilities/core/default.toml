# capabilities/core/default.toml
# Capability: core
# Provider: Octomind built-in core server
# Title: Core Built-ins
# Description: Recall folded context blocks with the recall tool of Octomind's built-in core server; active only when compression attention is enabled.
# Provides tools: recall — only when [compression.attention] or its governance is enabled

[roles.mcp]
server_refs = ["core"]
allowed_tools = ["core:*"]

[[mcp.servers]]
name = "core"
type = "builtin"
timeout_seconds = 30
tools = []
