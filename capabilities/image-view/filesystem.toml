# capabilities/image-view/filesystem.toml
# Capability: image-view
# Provider: MCP filesystem reference server — read_media_file only
# Title: Image Viewer for AI Agents
# Description: Let the AI see and analyze local images (PNG, JPEG, GIF, WebP) via MCP: check renders, charts, video frames, screenshots. Read-only.
# Provides tools: read_media_file
#
# read_media_file returns the file as an MCP image block, which octomind hands to
# the model as an image. Access is limited to the session's working directory.
# mcp-versions: hold @modelcontextprotocol/server-filesystem
# Held at 2025.8.21: later releases repeat the base64 image in structuredContent,
# which octomind also appends to the tool result as text (~6K extra tokens per
# image after truncation). Lift the hold once octomind replaces mirrored image
# data in structured content.
# zod is pinned to 3: the server takes zod through the MCP SDK ("^3.25 || ^4.0"),
# npm picks 4, and zod-to-json-schema 3.x then emits every tool schema as a bare
# `$schema` with no `type`/`properties` — Anthropic rejects the whole request
# (`tools.N.custom.input_schema.type: Field required`).

[deps]
require = ["modelcontextprotocol/filesystem"]

[roles.mcp]
server_refs = ["image-view"]
allowed_tools = ["read_media_file"]

[[mcp.servers]]
name = "image-view"
type = "stdio"
command = "sh"
args = ["-c", "exec npx -y -p @modelcontextprotocol/server-filesystem@2025.8.21 -p zod@3.25.76 mcp-server-filesystem \"$PWD\""]
timeout_seconds = 60
tools = []
