# capabilities/calendar/google-calendar.toml
# Capability: calendar
# Provider: Google Calendar — community MCP server (@cocal/google-calendar-mcp)
# Title: Google Calendar
# Description: Manage Google Calendar events and scheduling via MCP.

[deps]
require = ["google/calendar"]

[roles.mcp]
server_refs = ["google-calendar"]
allowed_tools = ["google-calendar:*"]

[[mcp.servers]]
name = "google-calendar"
type = "stdio"
command = "npx"
args = ["-y", "@cocal/google-calendar-mcp@2.6.2"]
timeout_seconds = 60
# GOOGLE_OAUTH_CREDENTIALS: path to a GCP OAuth keys JSON file (desktop app credentials).
env = { GOOGLE_OAUTH_CREDENTIALS = "{{ENV:GOOGLE_OAUTH_CREDENTIALS}}" }
tools = []
