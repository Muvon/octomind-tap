# capabilities/publish-tiktok/tiktok-posting.toml
# Capability: publish-tiktok
# Provider: upload-post.com gateway — TikTok video publishing (no direct TikTok MCP exists)
# Title: TikTok Publishing
# Description: Direct Post / Inbox upload of finished video creative via the TikTok Content Posting API.
# Provides tools: upload_video, upload_photos, get_status, get_job_status, list_scheduled, cancel_scheduled, edit_scheduled, retry_post, unpublish_post

[deps]
require = ["tiktok-posting/tiktok-posting"]

[roles.mcp]
server_refs = ["tiktok-posting"]
allowed_tools = ["upload_video", "upload_photos", "get_status", "get_job_status", "list_scheduled", "cancel_scheduled", "edit_scheduled", "retry_post", "unpublish_post"]

[[mcp.servers]]
name = "tiktok-posting"
type = "stdio"
command = "npx"
args = ["-y", "@upload-post/mcp@0.7.0"]
timeout_seconds = 240
env = { UPLOAD_POST_API_KEY = "{{ENV:UPLOAD_POST_API_KEY}}" }
tools = []
