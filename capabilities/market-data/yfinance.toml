# capabilities/market-data/yfinance.toml
# Capability: market-data
# Provider: yfinance — Yahoo Finance data via MCP
# Title: Market Data
# Description: Fetch Yahoo Finance stock quotes, company financial reports, and historical market data through the yfinance MCP server.

[deps]
require = ["yahoo/yfinance"]

[roles.mcp]
server_refs = ["yfinance"]
allowed_tools = ["yfinance:*"]

[[mcp.servers]]
name = "yfinance"
type = "stdio"
command = "npx"
args = ["-y", "@szemeng76/yfinance-mcp-server@0.1.0"]
timeout_seconds = 60
tools = []
