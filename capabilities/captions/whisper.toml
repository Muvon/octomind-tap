# capabilities/captions/whisper.toml
# Capability: captions
# Provider: OpenAI Whisper — fast transcription, no diarization
# Title: Captions / Transcripts
# Description: Plain transcription / SRT generation via the Whisper MCP server.
# Provides tools: transcribe_audio, list_audio_files, convert_audio, compress_audio

[deps]
require = ["whisper/whisper"]

[roles.mcp]
server_refs = ["whisper"]
allowed_tools = ["transcribe_audio", "list_audio_files", "convert_audio", "compress_audio"]

[[mcp.servers]]
name = "whisper"
type = "stdio"
command = "sh"
# --with mcp<2: server imports mcp.server.fastmcp, removed in the mcp 2.x SDK.
# sh wrapper: octomind drops the env table at parse time, so constants and
# derived paths must be exported by the launch command itself.
args = ["-c", "mkdir -p \"$PWD/video-out\"; AUDIO_FILES_PATH=\"$PWD/video-out\" exec uvx --with 'mcp<2' mcp-server-whisper==1.1.0"]
timeout_seconds = 120
env = { OPENAI_API_KEY = "{{ENV:OPENAI_API_KEY}}" }
tools = []
