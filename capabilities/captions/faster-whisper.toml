# capabilities/captions/faster-whisper.toml
# Capability: captions
# Provider: faster-whisper — local word-timestamp transcription via the whisper-ctranslate2 CLI
# Title: Captions / Transcripts
# Description: Local faster-whisper speech-to-text with word-level timestamps as JSON for word-timed captions; no API key, run through the shell tool.
# Provides tools: (none — `whisper-ctranslate2` and the `video-captions` renderer via shell; ffmpeg with libass burns the captions)

[deps]
require = ["softcatala/whisper-ctranslate2", "muvon/video-captions", "muvon/video-fonts", "ffmpeg/ffmpeg"]
