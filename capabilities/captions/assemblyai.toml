# capabilities/captions/assemblyai.toml
# Capability: captions
# Provider: AssemblyAI — diarized captions, chapters, sentiment
# Title: Captions / Transcripts
# Description: AssemblyAI audio transcription with diarized captions, chapters, and sentiment analysis.
# Provides tools: transcribe_url, transcribe_file, submit_transcription, get_transcript
# Note: these tools return transcript text only — no word timings or SRT. For burned,
# word-timed captions use the default faster-whisper provider; the `video-captions`
# renderer is installed with every captions provider.

[deps]
require = ["assemblyai/assemblyai", "muvon/video-captions", "ffmpeg/ffmpeg"]

[roles.mcp]
server_refs = ["assemblyai"]
allowed_tools = ["transcribe_url", "transcribe_file", "submit_transcription", "get_transcript"]

[[mcp.servers]]
name = "assemblyai"
type = "stdio"
command = "npx"
args = ["-y", "assembly-ai-mcp@0.0.2"]
timeout_seconds = 180
env = { ASSEMBLYAI_API_KEY = "{{ENV:ASSEMBLYAI_API_KEY}}" }
tools = []
