# capabilities/legal-ca/ansvar.toml
# Capability: legal-ca
# Provider: @ansvar/canadian-law-mcp — Canadian legislation with bilingual support
# Title: Canadian Law
# Description: Search Canadian federal statutes and regulations in both English and French via the Ansvar Canadian law MCP server (@ansvar/canadian-law-mcp).

[deps]
require = ["ansvar/canadian-law-mcp"]

[roles.mcp]
server_refs = ["canada-law"]
allowed_tools = ["canada-law:*"]

[[mcp.servers]]
name = "canada-law"
type = "stdio"
command = "npx"
args = ["-y", "@ansvar/canadian-law-mcp@1.1.2"]
timeout_seconds = 60
tools = []
