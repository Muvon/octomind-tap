# capabilities/music/elevenlabs-music.toml
# Capability: music
# Provider: ElevenLabs Music — same SDK as elevenlabs voice, music endpoints
# Title: Music Generation
# Description: ElevenLabs Music for higher-fidelity bespoke ad tracks via the elevenlabs MCP.
# Provides tools: compose_music, create_composition_plan, video_to_music, upload_music_for_inpainting, text_to_sound_effects, play_audio

[deps]
require = ["elevenlabs/elevenlabs"]

[roles.mcp]
server_refs = ["elevenlabs"]
allowed_tools = ["compose_music", "create_composition_plan", "video_to_music", "upload_music_for_inpainting", "text_to_sound_effects", "play_audio"]

[[mcp.servers]]
name = "elevenlabs"
type = "stdio"
command = "uvx"
args = ["elevenlabs-mcp==0.11.0"]
timeout_seconds = 120
env = { ELEVENLABS_API_KEY = "{{INPUT:ELEVENLABS_API_KEY}}" }
tools = []
