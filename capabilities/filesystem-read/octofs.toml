# capabilities/filesystem-read/octofs.toml
# Capability: filesystem-read
# Provider: octofs — Octomind's native filesystem MCP server (read-only subset)
# Title: Filesystem (Read)
# Description: Read files and line ranges, list directories, and search file contents by text, regex or syntax pattern in the project. No write access.

[deps]
require = ["muvon/octofs"]

[roles.mcp]
server_refs = ["octofs"]
allowed_tools = ["octofs:view"]

[[mcp.servers]]
name = "octofs"
type = "stdio"
command = "octofs"
args = ["mcp"]
timeout_seconds = 300
tools = []
