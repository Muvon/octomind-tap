# capabilities/payments/stripe.toml
# Capability: payments
# Provider: Stripe — official agent toolkit MCP server
# Title: Payments (Stripe)
# Description: Stripe customer, charge, subscription, and invoice management via the official @stripe/mcp server.

[deps]
require = ["stripe/stripe"]

[roles.mcp]
server_refs = ["stripe"]
allowed_tools = ["stripe:*"]

[[mcp.servers]]
name = "stripe"
type = "stdio"
command = "npx"
args = ["-y", "@stripe/mcp@0.3.3"]
timeout_seconds = 60
env = { STRIPE_SECRET_KEY = "{{ENV:STRIPE_SECRET_KEY}}" }
tools = []
