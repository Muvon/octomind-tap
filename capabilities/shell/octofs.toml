# capabilities/shell/octofs.toml
# Capability: shell
# Provider: octofs — Octomind's native shell execution MCP server
# Title: Shell
# Description: Run shell commands in the project directory with the octofs shell tool: builds, tests, git, and other project command-line tools.

[deps]
require = ["muvon/octofs"]

[roles.mcp]
server_refs = ["octofs"]
allowed_tools = ["octofs:shell"]

[[mcp.servers]]
name = "octofs"
type = "stdio"
command = "octofs"
args = ["mcp"]
timeout_seconds = 300
tools = []
