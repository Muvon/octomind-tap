# capabilities/maps/google-maps.toml
# Capability: maps
# Provider: Google Maps — official MCP reference server
# Title: Maps & Geolocation
# Description: Geocode addresses, get directions, search places, and look up elevation via Google Maps (mcp-google-map). Needs GOOGLE_MAPS_API_KEY.

[deps]
require = ["google-maps/maps"]

[roles.mcp]
server_refs = ["google-maps"]
allowed_tools = ["google-maps:*"]

[[mcp.servers]]
name = "google-maps"
type = "stdio"
command = "npx"
args = ["-y", "@cablate/mcp-google-map@0.0.69", "--stdio"]
timeout_seconds = 120
env = { GOOGLE_MAPS_API_KEY = "{{ENV:GOOGLE_MAPS_API_KEY}}" }
tools = []
