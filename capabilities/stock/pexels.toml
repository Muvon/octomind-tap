# capabilities/stock/pexels.toml
# Capability: stock
# Provider: Pexels — free b-roll video and photos
# Title: Stock Media
# Description: Free b-roll videos and photos via the Pexels API.
# Provides tools: searchPhotos, searchVideos, getPhoto, getVideo, downloadPhoto, downloadVideo, getCuratedPhotos, getPopularVideos, getFeaturedCollections, getCollectionMedia

[deps]
require = ["pexels/pexels"]

[roles.mcp]
server_refs = ["pexels"]
allowed_tools = ["searchPhotos", "searchVideos", "getPhoto", "getVideo", "downloadPhoto", "downloadVideo", "getCuratedPhotos", "getPopularVideos", "getFeaturedCollections", "getCollectionMedia"]

[[mcp.servers]]
name = "pexels"
type = "stdio"
command = "npx"
args = ["-y", "pexels-mcp-server@1.0.0"]
timeout_seconds = 60
env = { PEXELS_API_KEY = "{{ENV:PEXELS_API_KEY}}" }
tools = []
