# capabilities/messaging-telegram/iflow-mcp.toml
# Capability: messaging-telegram
# Provider: @iflow-mcp/telegram-mcp-server — Telegram bot messaging
# Title: Telegram Bot Messaging
# Description: Send and read Telegram messages in chats, channels, and groups as a bot via @iflow-mcp/telegram-mcp-server. Needs TELEGRAM_BOT_TOKEN.

[deps]
require = ["iflow-mcp/telegram"]

[roles.mcp]
server_refs = ["telegram"]
allowed_tools = []

[[mcp.servers]]
name = "telegram"
type = "stdio"
command = "npx"
args = ["-y", "@iflow-mcp/telegram-mcp-server@0.3.0"]
timeout_seconds = 60
env = { TELEGRAM_BOT_TOKEN = "{{ENV:TELEGRAM_BOT_TOKEN}}" }
tools = []
