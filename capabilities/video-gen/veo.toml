# capabilities/video-gen/veo.toml
# Capability: video-gen
# Provider: Google Veo 3 — text-to-video and image-to-video with native audio
# Title: Video Generation
# Description: Text-to-video and image-to-video with native dialogue / SFX via Google Veo 3.
# Provides tools: generate_video, extend_video, interpolate_frames, get_video_status

[deps]
require = ["google/veo"]

[roles.mcp]
server_refs = ["veo"]
allowed_tools = ["generate_video", "extend_video", "interpolate_frames", "get_video_status"]

[[mcp.servers]]
name = "veo"
type = "stdio"
command = "npx"
# npx -p form: the package ships two binaries; plain `npx -y` cannot pick one.
args = ["-y", "-p", "google-veo3-1-mcp-server@1.2.0", "veo3-mcp-server"]
timeout_seconds = 180
env = { GOOGLE_API_KEY = "{{ENV:GOOGLE_API_KEY}}" }
tools = []
