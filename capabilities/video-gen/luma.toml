# capabilities/video-gen/luma.toml
# Capability: video-gen
# Provider: Luma official remote MCP — Ray video and Photon image models
# Title: Video Generation
# Description: Text-to-video and image-to-video AI with Luma Dream Machine (Ray models). Edit, extend, reframe clips via Luma's official MCP server.
# Auth: OAuth 2.1 sign-in with a Luma account. The first session opens a browser;
# octomind stores and refreshes the token. Generations spend the chosen team's credits.

[roles.mcp]
server_refs = ["luma"]
allowed_tools = ["luma:*"]

[[mcp.servers]]
name = "luma"
type = "http"
url = "https://agents.lumalabs.ai/mcp"
timeout_seconds = 600
tools = []
