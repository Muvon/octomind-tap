# capabilities/video-gen/runway.toml
# Capability: video-gen
# Provider: Runway official remote MCP — Gen-4.5 and partner video models on Runway Dev
# Title: Video Generation
# Description: Text-to-video and image-to-video via Runway's official MCP server with Gen-4.5 and partner models, paid with Runway Dev credits.
# Auth: OAuth sign-in with a Runway Dev account, which is separate from the Runway app.
# The first session opens a browser; octomind stores and refreshes the token.
# Generations spend Runway Dev credits, bought in the developer portal.

[roles.mcp]
server_refs = ["runway"]
allowed_tools = ["runway:*"]

[[mcp.servers]]
name = "runway"
type = "http"
url = "https://dev.runwayml.com/mcp"
timeout_seconds = 600
tools = []
