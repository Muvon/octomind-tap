# capabilities/video-gen/runway.toml
# Capability: video-gen
# Provider: Runway Gen-4 Turbo and Gen-4 Aleph — image-to-video generation and video-to-video editing
# Title: Video Generation
# Description: Image-to-video via Runway Gen-4 Turbo, video editing with Gen-4 Aleph, Gen-4 reference images, and video upscaling.
# Provides tools: runway_generateVideo, runway_generateImage, runway_upscaleVideo, runway_editVideo, runway_getTask

[deps]
require = ["runwayml/runway"]

[roles.mcp]
server_refs = ["runway"]
allowed_tools = ["runway_*"]

[[mcp.servers]]
name = "runway"
type = "stdio"
command = "npx"
args = ["-y", "runway-api-mcp-server@1.0.0"]
timeout_seconds = 120
env = { RUNWAYML_API_SECRET = "{{ENV:RUNWAYML_API_SECRET}}" }
tools = []
