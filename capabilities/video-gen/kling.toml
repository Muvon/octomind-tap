# capabilities/video-gen/kling.toml
# Capability: video-gen
# Provider: Kling official remote MCP — Kling video models on a Kling account
# Title: Video Generation
# Description: Text-to-video and image-to-video with Kling AI through Kling's official MCP server, signed in with a Kling account and paid from its credits.
# Auth: OAuth sign-in with a Kling account. The first session opens a browser;
# octomind stores and refreshes the token. Generations spend Kling account credits.

[roles.mcp]
server_refs = ["kling"]
allowed_tools = ["kling:*"]

[[mcp.servers]]
name = "kling"
type = "http"
url = "https://kling.ai/mcp"
timeout_seconds = 600
tools = []
