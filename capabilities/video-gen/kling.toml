# capabilities/video-gen/kling.toml
# Capability: video-gen
# Provider: Kling AI — text-to-video with strong motion physics
# Title: Video Generation
# Description: Text-to-video and image-to-video via Kling AI 2.x with strong motion physics.
# Provides tools: generate_video, generate_image_to_video, check_video_status, extend_video, create_lipsync, apply_video_effect, list_tasks, get_account_balance

[deps]
require = ["kling/kling"]

[roles.mcp]
server_refs = ["kling"]
allowed_tools = ["generate_video", "generate_image_to_video", "check_video_status", "extend_video", "create_lipsync", "apply_video_effect", "list_tasks", "get_account_balance"]

[[mcp.servers]]
name = "kling"
type = "stdio"
command = "npx"
args = ["-y", "mcp-kling@5.2.0"]
timeout_seconds = 180
env = { KLING_ACCESS_KEY = "{{INPUT:KLING_ACCESS_KEY}}", KLING_SECRET_KEY = "{{INPUT:KLING_SECRET_KEY}}" }
tools = []
