# capabilities/seo-data/search-console.toml
# Capability: seo-data
# Provider: search-console
# Title: Google Search Console Evidence
# Description: First-party search analytics and URL inspection via mcp-server-gsc. Requires GOOGLE_APPLICATION_CREDENTIALS and property access.
# https://www.npmjs.com/package/mcp-server-gsc
# Env: GOOGLE_APPLICATION_CREDENTIALS — absolute path to a private service-account JSON file.
# Enable Search Console API and grant the service account access to the authorized property.
# Community MCP wrapper, not a Google-published server. Read-only tools; no sitemap submission.
# Search Console Web totals may include AI features; this is not an AI-only visibility report.

[deps]
require = ["google/search-console"]

[roles.mcp]
server_refs = ["search-console"]
allowed_tools = ["search-console:list_sites", "search-console:search_analytics", "search-console:enhanced_search_analytics", "search-console:detect_quick_wins", "search-console:index_inspect", "search-console:list_sitemaps", "search-console:get_sitemap"]

[[mcp.servers]]
name = "search-console"
type = "stdio"
command = "npx"
args = ["-y", "mcp-server-gsc@0.3.0"]
timeout_seconds = 120
env = { GOOGLE_APPLICATION_CREDENTIALS = "{{ENV:GOOGLE_APPLICATION_CREDENTIALS}}" }
tools = ["list_sites", "search_analytics", "enhanced_search_analytics", "detect_quick_wins", "index_inspect", "list_sitemaps", "get_sitemap"]
