# capabilities/seo-data/dataforseo.toml
# Capability: seo-data
# Provider: DataForSEO official MCP server
# Title: DataForSEO MCP: Keyword, SERP and Backlink Data
# Description: Keyword metrics, Google SERPs, and backlink research via DataForSEO MCP. Requires DATAFORSEO_LOGIN and DATAFORSEO_PASSWORD.
# https://github.com/dataforseo/mcp-server-typescript
# Env: DATAFORSEO_LOGIN and DATAFORSEO_PASSWORD — API credentials from app.dataforseo.com/api-access, not the account password.
# API requests may be billable; read endpoint documentation and confirm scope/budget before paid requests.

[deps]
require = ["dataforseo/mcp-server"]

[roles.mcp]
server_refs = ["dataforseo"]
allowed_tools = ["dataforseo:docs_index", "dataforseo:docs_list_sections", "dataforseo:docs_search", "dataforseo:api_request"]

[[mcp.servers]]
name = "dataforseo"
type = "stdio"
command = "npx"
args = ["-y", "dataforseo-mcp-server@3.1.3"]
timeout_seconds = 120
env = { DATAFORSEO_LOGIN = "{{ENV:DATAFORSEO_LOGIN}}", DATAFORSEO_PASSWORD = "{{ENV:DATAFORSEO_PASSWORD}}" }
tools = []
