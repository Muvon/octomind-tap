# capabilities/browser/playwright.toml
# Capability: browser
# Provider: Playwright — browser automation, navigation, screenshots, scraping
# Title: Browser (Playwright)
# Description: Headless Chromium control through the Playwright MCP server: open pages, click and type, take screenshots, and scrape page content.
# https://github.com/microsoft/playwright-mcp

[deps]
require = ["microsoft/playwright"]

[roles.mcp]
server_refs = ["playwright"]
allowed_tools = ["playwright:*"]

[[mcp.servers]]
name = "playwright"
type = "stdio"
command = "npx"
args = ["@playwright/mcp@0.0.83", "--headless"]
timeout_seconds = 120
tools = []
