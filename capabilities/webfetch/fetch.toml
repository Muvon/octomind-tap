# capabilities/webfetch/fetch.toml
# Capability: webfetch
# Provider: Fetch — official MCP reference server
# Title: Web Fetch
# Description: Fetch any URL and convert to markdown for LLM consumption.

[deps]
require = ["modelcontextprotocol/fetch"]

[roles.mcp]
server_refs = ["fetch"]
allowed_tools = ["fetch:*"]

[[mcp.servers]]
name = "fetch"
type = "stdio"
command = "uvx"
# --with mcp<2: server imports v1 SDK symbols removed in the mcp 2.x SDK.
args = ["--with", "mcp<2", "mcp-server-fetch==2026.7.10"]
timeout_seconds = 60
tools = []
