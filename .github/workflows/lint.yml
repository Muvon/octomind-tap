name: Lint

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# A new push supersedes whatever is still running for the same branch or PR —
# there is no point burning runners on a commit nobody is looking at any more.
# Grouping by workflow + ref keeps master, each branch and each PR independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint manifests & skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up symlinks for capabilities
        run: bash scripts/setup-symlinks.sh

      - name: Lint all manifests
        run: bash scripts/lint-manifests.sh

      - name: Lint all capabilities
        run: bash scripts/lint-capabilities.sh

      - name: Validate capability resolution
        run: |
          chmod +x bin/load
          bash scripts/validate-capabilities.sh --quiet

      - name: Lint all skills
        run: bash scripts/lint-skills.sh

      - name: Lint all dep scripts
        run: bash scripts/lint-deps.sh

  brief:
    uses: muvon/ci-workflow/.github/workflows/brief.yml@master
    secrets: inherit
