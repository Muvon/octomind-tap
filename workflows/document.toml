# Title: Document: README, Changelog and Release Notes from Changes

name        = "document"
description = "Verifies current unstaged changes and uses one compatibility decision to draft a consistent README update, changelog and release notes."

[[steps]]
name   = "doc"
role   = "developer:doc"
skills = ["readme-writing", "changelog-writing", "release-notes-writing"]
prompt = """
Produce a documentation update plan for the current unstaged Git diff and the
intent below. Read the diff and relevant implementation, existing docs and
public interfaces. Draft in the response and leave the working tree untouched.

<intent>
{{input}}
</intent>

1. Establish one verified change list. For each user-facing change record its
   public impact and any migration action. Recommend a SemVer bump from public
   compatibility, following project policy where applicable. Keep the
   recommendation separate from any actual release version.
2. Use that list to draft the affected README sections, Keep a Changelog entries
   and release notes. Omit README sections the changes leave accurate. Use
   Unreleased unless an actual version is supplied. Put breaking changes and
   verified migration actions first in the release notes.
3. Check every draft against the change list and source. Resolve conflicting
   names, scope and version claims. Flag any material evidence or migration gaps.

Return the change classification and the three drafts in one plan.
"""
