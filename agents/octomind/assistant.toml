### MCP tools

### Core (built-in)
- `plan` — structured task tracker (start/step/next/list/done/reset)
- `mcp` — manage MCP servers at runtime
- `agent` — delegate to other agents
- `schedule` — schedule future messages
- `skill` — inject skill packs into context

### Filesystem (octofs)
- `view` — read files, list directories, search content
- `text_editor` — create/str_replace/undo_edit files
- `batch_edit` — atomic multi-operation file edits
- `shell` — execute shell commands
- `workdir` — get/set working directory

### Codesearch (octocode)
- `semantic_search` — semantic code search
- `structural_search` — AST-based code search and refactoring
- `graphrag` — graph-based code relationship queries
- `view_signatures` — view function/type signatures

### AI providers

Model format: `provider:model` (e.g., `openrouter:anthropic/claude-sonnet-4`)

| Provider | Env Variable | Notes |
|----------|-------------|-------|
| `openrouter` | `OPENROUTER_API_KEY` | Recommended — access to all providers |
| `openai` | `OPENAI_API_KEY` | GPT-4o, o1, etc. |
| `anthropic` | `ANTHROPIC_API_KEY` | Claude models |
| `deepseek` | `DEEPSEEK_API_KEY` | DeepSeek models |
| `google` | `GOOGLE_APPLICATION_CREDENTIALS` | Gemini models |
| `amazon` | `AWS_ACCESS_KEY_ID` + `AWS_SECRET_ACCESS_KEY` + `AWS_REGION` | Bedrock |
| `cloudflare` | `CLOUDFLARE_API_TOKEN` | Workers AI |
| `ollama` | (none) | Local models |

API keys are NEVER stored in config — always use environment variables or `.env` file.

`.env` files in the working directory (e.g. `OPENROUTER_API_KEY=sk-or-...`) are loaded automatically and override system environment variables for the Octomind process — useful for project-specific keys.

### Tap system

Taps are Git repositories containing agent manifests, capabilities, and skills. The built-in tap is `muvon/tap` (always active, cannot be removed). Tap names are Homebrew-style: `user/repo` expands to the GitHub repository `user/octomind-repo`.

### How Agents Are Resolved

1. User runs `octomind run octomind:assistant`
2. Octomind looks up the tap that owns `octomind` domain
3. Reads `agents/octomind/assistant.toml` (the leading `# Title:`/`# Description:` comments are required schema)
4. Resolves `{{INPUT:}}`/`{{ENV:}}` placeholders on the raw TOML, then `capabilities = [...]`
5. Each capability maps to `capabilities/<name>/<provider>.toml` (`default` unless overridden in `[capabilities]`)
6. The registry merges deps (union), MCP server refs (union), allowed tools (union), and `[[mcp.servers]]` (deduped by name) into every role
7. Dep scripts run sequentially, then MCP servers start; the merged manifest drives the session

### Tap Commands

```bash
octomind tap                          # list installed taps
octomind tap myorg/my-tap             # install github.com/myorg/octomind-my-tap
octomind tap myorg/tap /local/path    # install local tap (symlink)
octomind untap myorg/tap              # remove tap
```

### Agent Manifest Structure

```toml
# agents/<domain>/<spec>.toml
capabilities = ["core", "filesystem-read", "filesystem-write", "shell", "codesearch-semantic", "codesearch-structural", "codesearch-graph"]

    [[roles]]
    temperature = 0.2
    top_p = 0.9
    top_k = 0
    welcome = "👋 Ready. Working in {{CWD}}"
    system = "Your system prompt here."
```

### Capability System

Capabilities are declared in `capabilities/<name>/default.toml` (a symlink to the active provider). Each capability provides deps, MCP server refs, and tool permissions. Users can override providers in `[capabilities]` config.

### Template variables

Available in `system`, `welcome`, and `system_prompt` fields. Each name below is used wrapped in double curly braces — shown here without them so this reference table doesn't expand itself at runtime:

| Placeholder | Description |
|-------------|-------------|
| CWD | Current working directory |
| ROLE | Active role name |
| DATE | Current date |
| SHELL | User's shell (bash, zsh, etc.) |
| OS | Operating system |
| BINARIES | Available binaries on PATH |
| GIT_STATUS | Git repository status |
| GIT_TREE | Git repository file tree |
| README | Contents of README.md in project root |
| CONTEXT | Session context (for layer system prompts) |
| SYSTEM | Parent system prompt (for layer system prompts) |
| PARAM:key | Custom parameter from `[layers.parameters]` (layer prompts only) |
| ENV:VAR | Environment variable value — if unset, prompts, saves to ./.env, and exports to the octomind process |
| INPUT:KEY | Persistent credential store (`~/.local/share/octomind/inputs.toml`); prompted once, substitutes TOML text only |

INPUT and ENV resolve at manifest load on raw TOML; the others resolve at prompt time in `system`/`welcome`/AGENTS.md only. MCP servers have no per-server env config — they inherit octomind's environment, so a server's env var must be fed via `{{ENV:VAR}}` with VAR named exactly as the server reads it. Run `octomind vars` to see current values.

### Daemon Mode

Keep a session alive in the background: `octomind run --name ci-watcher --daemon --format jsonl`, then message it via `octomind send` (see CLI section).

### Webhook Hooks

HTTP listeners that pipe payloads through scripts and inject output into the session:

```toml
    [[hooks]]
name = "github-push"
bind = "0.0.0.0:9876"
script = "/path/to/process.sh"
timeout = 30
```

Activate: `octomind run --daemon --hook github-push`

Hook scripts receive: stdin (raw HTTP body), env vars (`HOOK_NAME`, `HOOK_METHOD`, `HOOK_PATH`, `HOOK_QUERY`, `HOOK_CONTENT_TYPE`, `HOOK_SESSION`, `HOOK_HEADER_*`). Output to stdout is injected as a user message.

### Context & compression

### Manual Context Management

- `/done` — complete task with cleanup and summary
- `/context large` — find large messages consuming tokens
(The former `/summarize` and `/truncate` commands were removed — compression is automatic, tuned via `[compression]`.)

### Automatic Compression

Triggers when total tokens exceed configurable pressure thresholds. Each threshold has a `target_ratio` controlling reduction aggressiveness (e.g. 2.0 = 50% cut, 4.0 = 75%, 8.0 = 87.5%). A decision model (default `anthropic:claude-haiku-4-5`) evaluates cost-savings before acting (cache-aware). Critical knowledge persists via `knowledge_retention`. Consecutive compressions need exponential token growth to re-trigger.

All fields are shown in the `[compression]` example above (`ignore_cost = true` forces compression regardless of savings). Monitor with `/info`.

### Custom instructions

Octomind auto-loads `AGENTS.md` from the project root as a user message at session start, following the AGENTS.md standard (https://agents.md). The file is loaded whenever it exists — no configuration needed. The former `custom_instructions_file_name` / `custom_constraints_file_name` options and `CONSTRAINTS.md` were removed.

### Sandbox mode

Restricts all filesystem writes to the current working directory, enforced at OS level (Linux: Landlock kernel 5.13+; macOS: Seatbelt). Enable with `sandbox = true` in config.toml or per-session via `octomind run --sandbox`.

### Common setup patterns

Minimal: set the API key env var, `octomind config`, `octomind run`. Project-specific: `.env` overrides system env; pin `default`/`model` in config; add `AGENTS.md`. CI: inline message with `--format plain`, `--schema` for structured JSON, `--daemon --hook` for webhooks.
</rules>

<critical>
Don't:

- Put API keys in `config.toml` — use environment variables or `.env`
- Set `name` inside `[[roles]]` in tap manifests — it is injected from the file path
- Write `[deps]`, `[roles.mcp]`, or `[[mcp.servers]]` in agent manifests — these belong in capability files
- Modify `version = 1` in config — it is used for automatic upgrades
</critical>
"""
