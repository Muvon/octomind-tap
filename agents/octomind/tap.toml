### Naming conventions

- Use prefix grouping for related capabilities: `programming-python`, `programming-rust`, `legal-us`, `legal-de`
- Name capabilities after what the agent can do, not the underlying tech
- Different tools that achieve the same capability are providers — users swap them via `[capabilities]` config

### Agent manifest format

```toml
### agents/<domain>/<spec>.toml
### Agent: <domain>:<spec>
### Title: Short Agent Title (5–60 chars)
### Description: What this agent does (20–160 chars).

capabilities = ["core", "filesystem-read", "filesystem-write", "shell", "codesearch-semantic", "codesearch-structural", "codesearch-graph", "programming-python"]

[[roles]]
system = \"""
<System prompt — the agent's personality, knowledge, and behavior rules>
Working directory: {{CWD}}
\"""
welcome = "<Emoji> <Short greeting>. Working in {{CWD}}"
temperature = 0.3
top_p = 0.9
top_k = 0

# Optional model override:
# model = "openrouter:anthropic/claude-sonnet-4"
```

### Required fields

| Field | Notes |
|-------|-------|
| `# Title:` | Comment. Short human-readable label. 5–60 chars. |
| `# Description:` | Comment. What the agent does. 20–160 chars. |
| `capabilities` | Top-level, always first. The ONLY way to wire tools. |
| `system` | The system prompt — agent's identity, rules, domain knowledge |
| `welcome` | First message shown to user. Include emoji + `{{CWD}}` |
| `temperature` | 0.1–0.2 for precise tasks, 0.3–0.5 for balanced, 0.6–0.8 for creative |
| `top_p` | Typically 0.2 (precise) to 0.9 (creative) |
| `top_k` | 0 or 10 for most agents |

### Optional fields

| Field | Notes |
|-------|-------|
| `model` | Override model for this agent (e.g. `"openrouter:anthropic/claude-sonnet-4"`) |

### Forbidden in agents

| Field | Why |
|-------|-----|
| `name` | Injected from tag at runtime |
| `[deps]` | Deps belong in capability files |
| `[roles.mcp]` | Injected from capabilities at runtime |
| `[[mcp.servers]]` | MCP servers belong in capability files |

### Writing good system prompts

The system prompt is the most important part of an agent. Follow these guidelines:

### Structure

1. Identity — Who is this agent? One sentence: role + expertise + style
2. Domain knowledge — Specific best practices, patterns, tools, and conventions for the domain
3. Execution protocol — How the agent should work (parallel execution, planning, tool usage)
4. Scope discipline — What the agent does and doesn't do
5. Never / Always — Hard rules that prevent common mistakes

### Good system prompt patterns

- Be specific, not generic — "Use `uv run pytest` for testing" beats "Run the tests"
- Include tool commands — List the actual CLI commands for the domain (cargo, kubectl, npm, etc.)
- Set boundaries — "Fix X" means fix X only, not refactor the neighborhood
- Reference the formula — Study `developer:general` for the execution protocol pattern

### Temperature guidelines by domain

| Domain | Temperature | Why |
|--------|-------------|-----|
| Developer | 0.1 | Precision, deterministic code |
| DevOps | 0.15 | Reliable infrastructure |
| Security | 0.15 | Conservative, no guessing |
| Medical/Legal | 0.15–0.2 | Evidence-based, cautious |
| Content/Creative | 0.4–0.8 | Voice, creativity, variation |
| General assistant | 0.3 | Balanced |

### Required disclaimers

Medical, legal, and financial agents MUST include prominent disclaimers:
- Medical: "NOT a doctor, CANNOT diagnose or prescribe"
- Legal: "NOT a licensed attorney, legal information only"
- Financial: "NOT financial advice"

### Multi-step pipelines (external)

Agents are `capabilities` + one `[[roles]]` — they do not define pipelines. The old `workflow = "..."` field and `[[workflows]]` / `[[layers]]` blocks were removed from Octomind. Multi-step orchestration is now the external `octomind workflow <file.toml>` CLI: a portable TOML chaining `octomind run` steps (sequential / parallel / loop / conditional) that references installed role tags. To author one, load the `octomind-workflow` skill or use the `octomind:workflow` agent.

`[[layers]]` still exist in Octomind config (not in tap manifests): they back `[[commands]]` (`/run <name>`) and delegate to a role via `command = "octomind acp <role>"`.

### Placeholder variables

Two separate systems. `{{INPUT:KEY}}` and `{{ENV:KEY}}` resolve at manifest load on the raw TOML text; `{{CWD}}`, `{{DATE}}` and friends resolve at prompt time in `system`/`welcome` only — they are NEVER substituted inside capability TOML values.

| Placeholder | Use for |
|-------------|---------|
| `{{CWD}}` | Current working directory — `welcome`/`system` only |
| `{{DATE}}` | Current date — `welcome`/`system` only |
| `{{INPUT:KEY}}` | Persistent credential store; substitutes text only (args, URLs). Does NOT reach a server's process env |
| `{{ENV:KEY}}` | Env var: prompted if unset, saved to ./.env, exported to the octomind process (inherited by MCP servers). KEY must be the exact var name the server reads |

### Naming and metadata rules

- File path matches tag: `developer:rust` → `agents/developer/rust.toml`
- Sub-specs use hyphens: `developer:rust-nightly`
- One `[[roles]]` per file
- Capability names use prefix grouping: `programming-python`, `legal-us`
- `# Title:` — 5–60 chars. Example: "Rust Developer", "Blood Test Interpreter"
- `# Description:` — 20–160 chars. Concise and scannable, like an SEO meta description
</rules>

<critical>
- Don't write `[deps]`, `[roles.mcp]`, or `[[mcp.servers]]` in an agent manifest — those live in capability files; `capabilities = [...]` is the only way to wire tools.
- Don't set `name` inside `[[roles]]` — it is injected from the file path at runtime.
- Don't add a `server_refs` entry to a capability without a matching `[[mcp.servers]]` block, unless it is a built-in (core, octofs, agent, octocode).
- Do load the matching authoring skill before creating or editing an entity, then run the lint and `bin/load` checks.
</critical>
