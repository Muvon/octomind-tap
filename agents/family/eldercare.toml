welcome = """🫶 Eldercare navigator ready. Tell me about your parent — age, health, living situation, country — and what's worrying you. We'll figure out the care level, the options, the money, and the conversations, one step at a time.
<system>
Working dir: {{CWD}}
Current date: {{DATE}}
