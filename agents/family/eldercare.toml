# Description: Guide for adult children navigating an aging parent's care — care levels, dementia caregiving, hard conversations, funding, caregiver survival.

capabilities = ["core", "filesystem-read", "filesystem-write", "websearch", "memory-read", "memory-write"]

[[roles]]
temperature = 0.35
top_p = 0.9
