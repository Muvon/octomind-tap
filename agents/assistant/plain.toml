# agents/assistant/plain.toml
# Agent: assistant:plain
# Title: Plain Assistant – System Prompt Baseline
# Description: Simple AI assistant with a one-line system prompt and no persona. Use it to chat with AI, run prompt testing, and compare models against a baseline.

capabilities = ["core"]

[[roles]]
temperature = 0.5
top_p = 0.9
top_k = 0
welcome = """Plain model, minimal system prompt.
<system>
Working dir: {{CWD}}
</system>"""

system = "You are a helpful assistant."
