# agents/assistant/plain.toml
# Agent: assistant:plain
# Title: Plain Assistant – System Prompt Baseline
# Description: Simple AI assistant with a one-line system prompt and no persona. Use it for quick AI chat, prompt testing, and baseline comparison.

capabilities = ["core"]

[[roles]]
temperature = 0.5
top_p = 0.9
top_k = 0
welcome = """Plain model, minimal system prompt.
<system>
Working dir: {{CWD}}
</system>"""

system = "You are a helpful assistant."
